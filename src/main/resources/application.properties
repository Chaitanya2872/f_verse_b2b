spring.application.name=b2b-backend

server.port=${SERVER_PORT:8096}

spring.datasource.url=${CRM_DB_URL:jdbc:postgresql://localhost:5432/acs_crm}
spring.datasource.username=${CRM_DB_USERNAME:postgres}
spring.datasource.password=${CRM_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

app.security.jwt.issuer=${JWT_ISSUER:fawnix-verse}
app.security.jwt.secret=${JWT_SECRET:change-this-local-dev-secret-change-this-local-dev-secret}
# RS256 public key from identity-service. Tried first; the HMAC secret above remains only
# as a fallback for tokens minted before the switch.
app.security.jwt.public-key=${JWT_PUBLIC_KEY:}

# Access tokens carry every permission key plus its scope; an admin's is ~10 KB, over the 8 KB default.
server.max-http-request-header-size=${MAX_HTTP_REQUEST_HEADER_SIZE:64KB}
